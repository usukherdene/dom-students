  <body class="min-h-screen min-w-[1000px] bg-[#09090b] font-sans text-[#f4f4f5]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#d9f99d]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#d9f99d]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#d9f99d] transition-colors hover:border-[#d9f99d]/35 hover:bg-[#d9f99d]/10 hover:text-[#f4f4f5] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#d9f99d] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />

          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#d9f99d]/65">The everyday collection / 06</span>
      </header>

<div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[576px] h-[575px] rounded-[24px] bg-[#18181B] border border-[#27272A] p-8 flex flex-col ">
          <div class="w-[159px] h-[29px] text-[#F4F4F5] text-[24px] font-semibold">Reaction time</div>
          <div class="w-[313px] h-[24px] mt-2 text-[#A1A1AA] text-[14px] font-normal">Wait for green, then click as quickly as you can.</div>
          <div class="w-[512px] h-[256px] mt-6 bg-[#27272A] rounded-[16px] flex flex-col items-center">
            <div class="w-[36px] h-[36px] border-[2px] border-[#F4F4F5] flex items-center rounded-full flex justify-center items-center mt-[75px]">
              <div class="w-[22px] h-[22px] border-[2px] border-[#F4F4F5] flex items-center rounded-full flex justify-center items-center">
                <div class="w-[6px] h-[6px] bg-[#F4F4F5] rounded-full"></div>
              </div>
            </div>
            <div class="text-[24px] text-[#F4F4F5] font-semibold mt-3">Ready when you are</div>
            <div class="text-[14px] text-[#F4F4F5] font-normal mt-3">Click to start</div>
          </div>
          <div class="w-[512px] h-[84px] mt-6 flex justify-between gap-3">
            <div class="w-[250px] h-[84px] rounded-[12px] bg-[#27272A] flex flex-col items-center">
              <div class="text-[24px] font-normal text-[#D9F99D] mt-[18px]">—</div>
              <div class="text-[12px] font-normal text-[#A1A1AA]">Last attempt</div>
            </div>
            <div class="w-[250px] h-[84px] rounded-[12px] bg-[#27272A] flex flex-col items-center">
              <div class="text-[24px] font-normal text-[#D9F99D] mt-[18px]">—</div>
              <div class="text-[12px] font-normal text-[#A1A1AA]">Best this session</div>
            </div>
          </div>
          <div class="text-[12px] text-[#A1A1AA] font-normal mt-5 text-center">Click the panel, or focus it and press Space or Enter. Clicking before green ends the attempt.</div>
        </div>
      </div>
    </div>

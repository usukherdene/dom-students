<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101b16] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#86efac]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#86efac]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#86efac] transition-colors hover:border-[#86efac]/35 hover:bg-[#86efac]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#86efac] motion-reduce:transition-none"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#86efac]/65">The everyday collection / 02</span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[520px] h-[571px] border-solid border border-[#304037] rounded-[24px] bg-[#192B22] flex flex-col pl-9 pt-9">
          <div class="w-11 h-11 bg-[#214630] text-[#86EFAC] flex items-center justify-center rounded-[12px]">
            <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M7.66602 9.58325H15.3327C16.9205 9.58325 18.2077 10.8704 18.2077 12.4583V17.2499C18.2077 18.8377 16.9205 20.1249 15.3327 20.1249H7.66602C6.0782 20.1249 4.79102 18.8377 4.79102 17.2499V12.4583C4.79102 10.8704 6.0782 9.58325 7.66602 9.58325Z"
                stroke-width="1.62917"
                stroke-linecap="round"
                stroke="#86EFAC"
              />
              <path
                d="M7.66602 9.58333V6.70833C7.66602 5.69167 8.06988 4.71665 8.78877 3.99776C9.50766 3.27887 10.4827 2.875 11.4993 2.875C12.516 2.875 13.491 3.27887 14.2099 3.99776C14.9288 4.71665 15.3327 5.69167 15.3327 6.70833V9.58333M11.4993 14.375V16.2917"
                stroke-width="1.62917"
                stroke-linecap="round"
                stroke="#86EFAC"
              />
            </svg>
          </div>
          <div class="w-[273px] h-[34px] font-semibold text-[#F0FDF4] text-[28px] mt-6">Password generator</div>
          <div class="w-[235px] h-[17px] text-[#A4B9AD] text-[14px] font-normal mt-2">A strong password. One click away.</div>
          <div class="w-[85px] h-[15px] mt-8 text-[12px] text-[#A4B9AD] font-normal">Your password</div>
          <div class="w-[448px] h-[64px] bg-[#101B16] rounded-[12px] border border-[#304037] mt-3 flex justify-between items-center">
            <div id="show-generated-password" class="flex-1 h-[24px] text-[18px] text-[#BBF7D0] font-normal ml-4"></div>
            <div id="copy-button" class="w-[55px] h-[32px] bg-[#1c2722] text-[#DCECE2] text-[12px] font-medium rounded-[8px] flex justify-center items-center mr-4">Copy</div>
          </div>
          <div id="message" class="w-[207px] h-[15px] mt-3 text-[12px] text-[#A4B9AD] font-normal">Uses letters, numbers, and symbols.</div>
          <div class="w-[448px] h-[28px] mt-6 flex justify-between items-center">
            <div class="w-[111px] h-[17px] text-[14px] text-[#DCECE2] font-normal">Password length</div>
            <div id="password-range-output" class="w-[22px] h-[24px] text-[#86EFAC] text-[18px] font-normal">16</div>
          </div>
          <input id="password-range-input" type="range" min="8" max="24" value="16" class="mt-4 cursor-pointer w-[448px] accent-[#4ADE80]" />
          <div class="w-[448px] h-[16px] mt-1 flex justify-between items-center">
            <div class="text-[#8AA294] text-[12px] font-normal">8</div>
            <div class="text-[#8AA294] text-[12px] font-normal">24</div>
          </div>
          <div id="generate-password-button" class="w-[448px] h-[48px] mt-7 rounded-[12px] bg-[#4ADE80] flex justify-center items-center text-[#102418] text-[14px] font-semibold">Generate password</div>
          <div class="w-[448px] h-[16] mt-5 text-[#8AA294] text-[12px] font-normal flex justify-center items-center">Generated in your browser. Never saved.</div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stopwatch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body class="min-h-screen min-w-[1000px] bg-[#101714] font-sans text-[#f0fdf4]">
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header class="flex h-24 shrink-0 items-center justify-between border-b border-[#c5d9bd]/10">
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#c5d9bd]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#c5d9bd] transition-colors hover:border-[#c5d9bd]/35 hover:bg-[#c5d9bd]/10 hover:text-[#f0fdf4] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#c5d9bd] motion-reduce:transition-none"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>
        <span class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#c5d9bd]/65">The everyday collection / 04</span>
      </header>
      
<div class="flex flex-1 items-center justify-center py-10">
        <div class="w-[620px] h-[551px] rounded-[28px] border-[#383f3c] border bg-[#19231E8C] p-10 flex flex-col">
          <div class="w-[540px] h-[44px] flex justify-between">
            <div class="w-[44px] h-[44px] flex justify-center items-center text-[#C5D9BD] bg-[#B5CBB21A] rounded-[12px]">
              <svg width="23" height="23" viewBox="0 0 23 23" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M19.1673 13.4167C19.1673 17.6508 15.7348 21.0833 11.5007 21.0833C7.26647 21.0833 3.83398 17.6508 3.83398 13.4167C3.83398 9.18248 7.26647 5.75 11.5007 5.75C15.7348 5.75 19.1673 9.18248 19.1673 13.4167Z" stroke-width="1.62917" stroke-linecap="round" stroke-linejoin="round" stroke="#C5D9BD"/>
<path d="M11.5 9.58341V13.4167L13.4167 15.3334M8.625 1.91675H11.5M11.5 1.91675H14.375M11.5 1.91675V5.75008M17.25 6.70841L19.1667 4.79175" stroke-width="1.62917" stroke-linecap="round" stroke-linejoin="round" stroke="#C5D9BD"/>
</svg>

            </div>
            <div id="state" class="w-[62px] h-[29px] rounded-[999px] border border-[#C5D9BD26] bg-[#B5CBB20D] text-[#C5D9BD] font-medium text-[12px] flex justify-center items-center">Ready</div>
          </div>
          <div class="w-[195px] h-[60px] mt-7 text-[#F0FDF4] text-[40px] font-normal">Stopwatch</div>
          <div class="mt-2 text-[#A4B9AD] text-[14px] font-normal">Make time for what matters.</div>
          <div class="w-[540px] h-[160px] border-t-[#B5CBB226] border-t-[1px] border-b-[#B5CBB226] border-b-[1px] mt-9 pt-9 pb-9 flex items-center justify-around">
            <div class="flex flex-col gap-4 items-center h-[86px] w-[166px]">
              <div id="hours" class="text-[56px] text-[#EDF3E8] font-light h-[56px] w-[66px]">00</div>
              <div class="text-[#9BAD9E] text-[9px] font-medium">HOURS</div>
            </div>
            <div class="text-[#5C7161] text-[40px] font-normal">:</div>
            <div class="flex flex-col gap-4 items-center h-[86px] w-[166px]">
              <div id="minutes" class="text-[56px] text-[#EDF3E8] font-light h-[56px] w-[66px]">00</div>
              <div class="text-[#9BAD9E] text-[9px] font-medium">MINUTES</div>
            </div>
            <div class="text-[#5C7161] text-[40px] font-normal">:</div>
            <div class="flex flex-col gap-4 items-center h-[86px]. w-[166px]">
              <div id="seconds" class="text-[56px] text-[#C5D9BD] font-light h-[56px] w-[66px]">00</div>
              <div class="text-[#9BAD9E] text-[9px] font-medium">SECONDS</div>
            </div>
          </div>
          <div class="w-[540px] h-[48px] mt-8 flex justify-between">
            <button type="button" id="start-button" class="w-[258px] h-[48px] rounded-[12px] bg-[#B5CBB2] text-[14px] text-[#102418] font-semibold flex justify-center items-center disabled:opacity-35">Start</button>
            <button type="button" id="pause-button" disabled class="w-[129px] h-[48px] rounded-[12px] text-[14px] text-[#DCECE2] font-medium flex justify-center items-center border border-[#DCECE2] disabled:opacity-35">Pause</button>
            <button type="button" id="reset-button" disabled class="w-[129px] h-[48px] rounded-[12px] text-[14px] text-[#A4B9AD] font-medium flex justify-center items-center border border-[#A4B9AD] disabled:opacity-35">Reset</button>
          </div>
          <div class="w-[540px] h-[16px] flex justify-center text-[#8AA294] text-[12px] font-normal mt-5">A moment of focus. At your own pace.</div>
        </div>
      </div>
    </div>
  </body>
</html>
